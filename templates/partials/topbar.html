<header class="topbar" role="banner">

  <!-- Marca institucional: logo oficial APPAM -->
  <div class="brand brand-appam">
    <button class="icon-btn" id="menu-toggle"
            title="Menú" aria-label="Abrir menú" style="display:none">
      <span>☰</span>
    </button>

    <a href="{{ url_for('dashboard.dashboard') }}"
       class="brand-link-appam"
       aria-label="Ir al Campus Virtual de la Academia Profissional Prof. Albino de Matos">
      <img src="{{ url_for('static', filename='img/logo-appam.webp') }}"
           alt="Academia Profissional Prof. Albino de Matos"
           class="brand-logo-appam">
    </a>
  </div>

  <!-- Navegación principal -->
  <nav class="top-nav" aria-label="Navegación principal">
    <a class="top-link {% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}"
       href="{{ url_for('dashboard.dashboard') }}">
      <span class="link-icon">▦</span>
      <span>Mi plan formativo</span>
    </a>

    <a class="top-link {% if request.endpoint == 'courses.courses' or request.endpoint == 'courses.course_detail' %}active{% endif %}"
       href="{{ url_for('courses.courses') }}">
      <span class="link-icon">☰</span>
      <span>Mis cursos</span>
    </a>

    <a class="top-link {% if request.endpoint == 'courses.ciclos' or request.endpoint == 'courses.ciclo_detail' %}active{% endif %}"
       href="{{ url_for('courses.ciclos') }}">
      <span class="link-icon">🎓</span>
      <span>Ciclos formativos</span>
    </a>

    <a class="top-link {% if request.endpoint == 'admin.admin' %}active{% endif %}"
       href="{{ url_for('admin.admin') }}">
      <span class="link-icon">⚙</span>
      <span>Administración del sitio</span>
    </a>

    <a class="top-link {% if request.endpoint == 'portal.portal' or request.endpoint == 'portal.portal_area' %}active{% endif %}"
       href="{{ url_for('portal.portal') }}">
      <span class="link-icon">⌂</span>
      <span>Portal</span>
    </a>
  </nav>

  <!-- Acciones de usuario -->
  <div class="top-actions">
    <button class="icon-btn" title="Notificaciones" aria-label="Notificaciones"
            onclick="abrirModal('Notificaciones', '<p class=&quot;modal-text&quot;>No tienes notificaciones nuevas.</p>')">
      <span>🔔</span>
      <span class="badge-dot"></span>
    </button>

    <button class="icon-btn" title="Mensajes" aria-label="Mensajes"
            onclick="abrirModal('Mensajes', '<p class=&quot;modal-text&quot;>No tienes mensajes nuevos.</p>')">
      <span>✉</span>
    </button>

    <span class="user-name">{{ usuario.nombre }}</span>

    <div class="avatar" title="Mi perfil"
         onclick="abrirModalPerfil()"
         role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')abrirModalPerfil()">
      {{ usuario.iniciales }}
    </div>
  </div>

</header>
