{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-messages" style="padding:0 24px">
      {% for category, message in messages %}
        <div class="toast {{ category }}" style="position:relative;margin-bottom:8px">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
